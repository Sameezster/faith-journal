name: mobile-ci
on:
  push: { paths: ["apps/mobile/**", "packages/**", ".github/workflows/mobile_ci.yaml"] }
  pull_request: { paths: ["apps/mobile/**", "packages/**"] }
jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.22.0", channel: stable }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test

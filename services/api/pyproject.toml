[project]
name = "faith-journal-api"
version = "1.0.0"
description = "Faith Journal service layer: AI categorization + Bible content."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "firebase-admin>=6.5",
    "httpx>=0.27",
    # Optional AI SDKs (install as needed; service runs without them via keyword fallback)
    # "google-generativeai>=0.7",
    # "openai>=1.30",
]

[project.optional-dependencies]
ai = ["google-generativeai>=0.7", "openai>=1.30"]
postgres = ["psycopg[binary]>=3.1", "asyncpg>=0.29"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

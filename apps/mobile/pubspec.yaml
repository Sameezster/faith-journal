name: faith_journal
description: Faith Journal — a Christian spiritual growth app (Android, iOS; Web in Phase 2).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # State & routing
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.0.0
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.5.1
  # Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  # Networking & storage
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  # Media & notifications
  record: ^6.0.0
  just_audio: ^0.9.38
  flutter_local_notifications: ^17.1.0
  # UI
  google_fonts: ^6.2.1
  fj_core:
    path: ../../packages/fj_core
  fj_ui:
    path: ../../packages/fj_ui
  fj_models:
    path: ../../packages/fj_models

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/bibles/

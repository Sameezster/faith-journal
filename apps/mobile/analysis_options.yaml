include: package:flutter_lints/flutter.yaml
linter:
  rules:
    prefer_const_constructors: true
    always_declare_return_types: true
    # require_trailing_commas intentionally OFF — `dart format` already
    # handles formatting, and the rule fires on short lines where a
    # trailing comma would force an awkward multi-line layout.
analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
